[package]
name = "parakeys"
version = "0.1.0"
edition = "2021"
description = "Like Apple Passwords, but for dotenv"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jmitchel3/ParaKeys"
readme = "README.md"

[[bin]]
name = "parakeys"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.4", features = ["derive"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
